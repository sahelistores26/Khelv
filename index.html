     * ============================================================================
     * ZAIKA — COMPLETE QR DINE-IN RESTAURANT ORDERING & MANAGEMENT ENGINE
     * ============================================================================
     * Architecture:
     * 1. Real-Time Sync Engine (BroadcastChannel + localStorage storage events +
     *    optional Firebase Realtime Database REST polling/push sync)
     * 2. Web Audio API Synthesizer (Pleasant non-intrusive chimes for Kitchen & Waiter)
     * 3. Role-Based State & PIN Verification (SHA-256 hashed PINs, session persistence)
     * 4. Modular View Renderers:
     *    - Table Selector (when ?table=X is absent)
     *    - Customer Portal (Welcome, Special, Quick Actions, Menu, Cart, Tracking, Fun, DND)
     *    - Kitchen Portal (Live KOT Queue, Timer, Spice/Notes, Status Workflow)
     *    - Waiter Portal (Assigned Tables, Live Alerts Feed, Done & History, Table Inspector)
     *    - Admin Portal (Menu, Categories, Tables & QR Generator, Staff & PINs, Settings/Quiz/Wheel)
     */

    // --------------------------------------------------------------------------
    // 1. AUDIO SYNTHESIZER (Web Audio API - Zero External Sound URLs)
    // --------------------------------------------------------------------------
    const SoundEngine = {
      enabled: localStorage.getItem('zaika_sound') !== 'false',
      ctx: null,
      lastPlayedAt: 0,

      init() {
        if (!this.ctx && (window.AudioContext || window.webkitAudioContext)) {
          this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      },

      toggle() {
        this.enabled = !this.enabled;
        localStorage.setItem('zaika_sound', String(this.enabled));
        if (this.enabled) {
          this.init();
          this.play('tap');
        }
        return this.enabled;
      },

      play(type = 'order') {
        if (!this.enabled) return;
        const nowMs = Date.now();
        if (type !== 'tap' && nowMs - this.lastPlayedAt < 900) return; // Prevent endless overlap
        this.lastPlayedAt = nowMs;

        try {
          this.init();
          if (!this.ctx) return;
          const now = this.ctx.currentTime;

          const playTone = (freq, startOffset, duration, wave = 'sine', gainVal = 0.14) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = wave;
            osc.frequency.setValueAtTime(freq, now + startOffset);
            gain.gain.setValueAtTime(0.001, now + startOffset);
            gain.gain.exponentialRampToValueAtTime(gainVal, now + startOffset + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.0001, now + startOffset + duration);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now + startOffset);
            osc.stop(now + startOffset + duration + 0.02);
          };

          if (type === 'order') {
            // Warm two-note kitchen chime (G5 -> C6)
            playTone(783.99, 0, 0.22, 'triangle', 0.16);
            playTone(1046.5, 0.14, 0.35, 'triangle', 0.16);
          } else if (type === 'ready') {
            // Bright triple bell (E5 -> G5 -> C6)
            playTone(659.25, 0, 0.16, 'sine', 0.15);
            playTone(783.99, 0.12, 0.16, 'sine', 0.15);
            playTone(1046.5, 0.24, 0.32, 'sine', 0.16);
          } else if (type === 'alert' || type === 'bill') {
            // Gentle double bell (A5 -> E5)
            playTone(880, 0, 0.18, 'sine', 0.14);
            playTone(659.25, 0.16, 0.26, 'sine', 0.14);
          } else if (type === 'tap') {
            playTone(600, 0, 0.08, 'sine', 0.07);
          }
        } catch (err) {
          // Silently fail if autoplay policy blocks audio before interaction
        }
      }
    };

    // Unlock audio context on first user gesture
    ['pointerdown', 'keydown'].forEach(evt => {
      window.addEventListener(evt, () => SoundEngine.init(), { once: true, passive: true });

    // --------------------------------------------------------------------------
    // 2. SECURITY & HASHING HELPERS (No Plain-Text PINs in State)
    // --------------------------------------------------------------------------
    function hashPinSync(pin) {
      // Deterministic salted hash so raw PINs are never stored in plain text
      let h1 = 0xdeadbeef ^ 918273;
      let h2 = 0x41c6ce57 ^ 192837;
      const salted = `ZAIKA_SALT_${String(pin).trim()}_2026`;
      for (let i = 0; i < salted.length; i++) {
        const ch = salted.charCodeAt(i);
        h1 = Math.imul(h1 ^ ch, 2654435761);
        h2 = Math.imul(h2 ^ ch, 1597334677);
      }
      h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
      h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
      return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(16);
    }

    function escapeHtml(str) {
      if (str === null || str === undefined) return '';
      return String(str)
        .replace(/&/g, '&amp;')

        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    // --------------------------------------------------------------------------
    // 4. REAL-TIME STORAGE & MULTI-TAB / FIREBASE SYNC ENGINE
    // --------------------------------------------------------------------------
    const DB_STORAGE_KEY = 'zaika_realtime_db_v1';
    const CHANNEL_NAME = 'zaika_realtime_channel_v1';

    const SyncStore = {
      db: null,
      channel: null,
      listeners: new Set(),
      syncStatus: 'Live Sync Active',
      lastRemoteTimestamp: 0,
      firebasePollTimer: null,

      init() {
        // Load persisted DB or initialize seed
        try {
          const raw = localStorage.getItem(DB_STORAGE_KEY);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && parsed.menuItems && parsed.tables && parsed.staff) {
              this.db = parsed;
            }
          }
        } catch (e) {
          console.warn('Storage read error, using fresh seed:', e);
        }

        if (!this.db) {
          this.db = createInitialDatabase();
          this.persistLocal(false);
        }

        // Cross-tab BroadcastChannel
        if ('BroadcastChannel' in window) {
          this.channel = new BroadcastChannel(CHANNEL_NAME);
          this.channel.onmessage = (event) => {
            if (event.data && event.data.type === 'DB_SYNC' && event.data.payload) {
              const incoming = event.data.payload;
              if (!this.db || incoming.updatedAt >= this.db.updatedAt) {
                this.handleIncomingChanges(this.db, incoming);
                this.db = incoming;
                localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(this.db));
                this.notifyListeners();
              }
            }
          };
        }

        // Fallback cross-tab localStorage event listener
        window.addEventListener('storage', (e) => {
          if (e.key === DB_STORAGE_KEY && e.newValue) {
            try {
              const incoming = JSON.parse(e.newValue);
              if (incoming && (!this.db || incoming.updatedAt >= this.db.updatedAt)) {
                this.handleIncomingChanges(this.db, incoming);
                this.db = incoming;
                this.notifyListeners();
              }
            } catch (err) {}
          }
        });

        this.setupFirebasePolling();
      },

      // Detect newly arriving orders/alerts from other tabs/devices to play audio cues
      handleIncomingChanges(prevDb, nextDb) {
        if (!prevDb || !nextDb) return;
        const prevOrderIds = new Set((prevDb.orders || []).map(o => o.id));
        const newOrders = (nextDb.orders || []).filter(o => !prevOrderIds.has(o.id));
        if (newOrders.length > 0 && AppState.activeView === 'kitchen') {
          SoundEngine.play('order');
          showToast(`Naya Order #${newOrders[0].orderNumber} (Table ${newOrders[0].tableNumber})!`, 'marigold');
        }

        const prevAlertIds = new Set((prevDb.alerts || []).map(a => a.id));
        const newAlerts = (nextDb.alerts || []).filter(a => !prevAlertIds.has(a.id) && !a.completedAt);
        if (newAlerts.length > 0 && AppState.activeView === 'waiter') {
          const al = newAlerts[0];
          const staff = getLoggedStaff();
          if (!staff || staff.role === 'Admin' || staff.id === al.waiterId) {
            SoundEngine.play(al.type === 'food_ready' ? 'ready' : 'alert');
            showToast(al.message, al.type === 'bill_request' ? 'chilli' : 'indigo');
          }
        }
      },

      subscribe(fn) {
        this.listeners.add(fn);
        return () => this.listeners.delete(fn);
      },

      notifyListeners() {
        this.listeners.forEach(fn => {
          try { fn(this.db); } catch (e) { console.error(e); }
        });
      },

      mutate(mutatorFn) {
        const prevSnapshot = JSON.parse(JSON.stringify(this.db));
        mutatorFn(this.db);
        this.db.updatedAt = Date.now();
        this.persistLocal(true);
        this.pushToFirebase();
        this.notifyListeners();
        return this.db;
      },

      persistLocal(broadcast = true) {
        try {
          localStorage.setItem(DB_STORAGE_KEY, JSON.stringify(this.db));
        } catch (e) {
          showToast('Storage full warning: Please clear old demo data.', 'chilli');
        }
        if (broadcast && this.channel) {
          try {
            this.channel.postMessage({ type: 'DB_SYNC', payload: this.db });
          } catch (e) {}
        }
      },

      resetDemoData() {
        this.db = createInitialDatabase();
        this.persistLocal(true);
        this.pushToFirebase();
        this.notifyListeners();
        showToast('Demo data fresh reset kar diya gaya hai ✓', 'success');
      },

      // Optional Firebase Realtime Database REST Sync (if Admin configures URL)
      setupFirebasePolling() {
        if (this.firebasePollTimer) clearInterval(this.firebasePollTimer);
        const url = (this.db?.settings?.firebaseDbUrl || '').trim().replace(/\/$/, '');
        if (!url) {
          this.syncStatus = 'Live Local Sync';
          return;
        }
        this.syncStatus = 'Cloud + Local Sync';
        this.firebasePollTimer = setInterval(async () => {
          const activeUrl = (this.db?.settings?.firebaseDbUrl || '').trim().replace(/\/$/, '');
          if (!activeUrl) return;
          try {
            const res = await fetch(`${activeUrl}/zaika_state.json`);
            if (res.ok) {
              const remote = await res.json();
              if (remote && remote.updatedAt && remote.updatedAt > this.db.updatedAt) {
                this.handleIncomingChanges(this.db, remote);
                this.db = remote;
                this.persistLocal(true);
                this.notifyListeners();
              }
              this.syncStatus = 'Firebase Live Connected';
            } else {
              this.syncStatus = 'Cloud Sync Warning';
            }
          } catch (err) {
            this.syncStatus = 'Offline (Local Sync Active)';
          }
        }, 3500);
      },

      async pushToFirebase() {
        const url = (this.db?.settings?.firebaseDbUrl || '').trim().replace(/\/$/, '');
        if (!url) return;
        try {
          await fetch(`${url}/zaika_state.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(this.db)
          });
        } catch (err) {
          // Graceful offline resilience
        }
      }
    };

    function detectTableFromUrl() {
      const params = new URLSearchParams(window.location.search);
      const t = parseInt(params.get('table'), 10);
      if (!isNaN(t) && t > 0) {
        AppState.tableNumber = t;
        localStorage.setItem('zaika_last_table', String(t));
      } else {
        AppState.tableNumber = null;
      }
    }

    function setTableNumber(num) {
      const parsed = parseInt(num, 10);
      if (isNaN(parsed) || parsed < 1) return;
      AppState.tableNumber = parsed;
      localStorage.setItem('zaika_last_table', String(parsed));
      // Update URL cleanly without reloading page
      const url = new URL(window.location.href);
      url.searchParams.set('table', String(parsed));
      window.history.pushState({ table: parsed }, '', url.toString());

      // Ensure table exists in DB
      const exists = SyncStore.db.tables.some(t => t.number === parsed);
      if (!exists) {
        SyncStore.mutate(db => {
          db.tables.push({
            number: parsed,
            label: `Table ${parsed}`,
            assignedWaiterId: db.staff.find(s => s.role === 'Waiter' && s.active)?.id || null,
            dnd: false,
            waiterCalledAt: null,
            billRequestedAt: null
          });
          db.tables.sort((a, b) => a.number - b.number);
        });
      }
      renderApp();
    }

    function clearTableSelection() {
      AppState.tableNumber = null;
      const url = new URL(window.location.href);
      url.searchParams.delete('table');
      window.history.pushState({}, '', url.toString());
      renderApp();
    }

      if (!AppState.staffSession) return null;

        AppState.staffSession = null;
        sessionStorage.removeItem('zaika_staff_session');
        return null;
      }
      return SyncStore.db.staff.find(s => s.id === AppState.staffSession.staffId && s.active) || null;
    }

    function showToast(message, variant = 'indigo') {
      const root = document.getElementById('toast-root');
      if (!root) return;
      const colors = {
        indigo: 'bg-indigoBrand text-white border-marigold/40',
        success: 'bg-success text-white border-white/20',
        marigold: 'bg-marigold text-inkLight border-indigoBrand/20 font-semibold',
        chilli: 'bg-chilli text-white border-white/20'
      };
      const el = document.createElement('div');
      el.className = `pointer-events-auto flex items-center justify-between gap-3 px-4 py-3 rounded-2xl shadow-float border text-sm transition-all duration-300 transform translate-y-0 opacity-100 ${colors[variant] || colors.indigo}`;
      el.innerHTML = `
        <span class="leading-snug">${escapeHtml(message)}</span>
        <button type="button" class="opacity-80 hover:opacity-100 text-xs px-1.5 py-0.5 rounded" aria-label="Close">✕</button>
      `;
      el.querySelector('button').onclick = () => el.remove();
      root.appendChild(el);
      setTimeout(() => {
        el.style.opacity = '0';
        el.style.transform = 'translateY(-6px)';
        setTimeout(() => el.remove(), 250);
      }, 3400);
    }

    function getTableRecord(tableNumber) {
      return SyncStore.db.tables.find(t => t.number === tableNumber) || {
        number: tableNumber,
        label: `Table ${tableNumber}`,
        assignedWaiterId: null,
        dnd: false,
        waiterCalledAt: null,
        billRequestedAt: null
      };
    }

    function getTableOrders(tableNumber) {
      return SyncStore.db.orders
        .filter(o => o.tableNumber === tableNumber)
        .sort((a, b) => b.createdAt - a.createdAt);
    }

    function getActiveTableOrders(tableNumber) {
      return getTableOrders(tableNumber).filter(o => o.status !== 'Serve hua');
    }

    function getCartSummary() {
      let totalQty = 0;
      let subtotal = 0;
      const validLines = [];

      AppState.cart.forEach(entry => {
        const item = SyncStore.db.menuItems.find(m => m.id === entry.itemId);
        if (!item || !item.inStock || entry.qty <= 0) return;
        const lineTotal = item.price * entry.qty;
        totalQty += entry.qty;
        subtotal += lineTotal;
        validLines.push({
          ...entry,
          item,
          lineTotal
        });
      });

      const scPct = Number(SyncStore.db.settings.serviceChargePercent) || 0;
      const serviceCharge = scPct > 0 ? Math.round((subtotal * scPct) / 100) : 0;
      const grandTotal = subtotal + serviceCharge;

      return { totalQty, subtotal, serviceCharge, grandTotal, validLines };
    }

    function updateCartQty(itemId, delta) {
      const item = SyncStore.db.menuItems.find(m => m.id === itemId);
      if (!item || !item.inStock) {
        showToast('Yeh dish abhi available nahi hai', 'chilli');
        return;
      }
      const idx = AppState.cart.findIndex(c => c.itemId === itemId);
      if (idx === -1 && delta > 0) {
        AppState.cart.push({ itemId, qty: 1, note: '' });
        SoundEngine.play('tap');
      } else if (idx !== -1) {
        const nextQty = AppState.cart[idx].qty + delta;
        if (nextQty <= 0) {
          AppState.cart.splice(idx, 1);
        } else {
          AppState.cart[idx].qty = nextQty;
          if (delta > 0) SoundEngine.play('tap');
        }
      }
      saveCart();
      renderApp();
    }

    function updateCartItemNote(itemId, noteText) {
      const entry = AppState.cart.find(c => c.itemId === itemId);
      if (entry) {
        entry.note = noteText;
        saveCart();
      }
    }

    function callWaiterForTable(tableNumber) {
      const now = Date.now();
      const table = getTableRecord(tableNumber);
      // Prevent duplicate alert spam within 20s or if already active
      if (table.waiterCalledAt && now - table.waiterCalledAt < 20000) {
        showToast('Waiter ko pehle hi bula diya gaya hai ✓', 'indigo');
        return;

      SyncStore.mutate(db => {
        const tbl = db.tables.find(t => t.number === tableNumber);
        if (tbl) tbl.waiterCalledAt = now;
        db.alerts.unshift({
          id: `alt_${now}_${Math.random().toString(36).slice(2, 6)}`,
          type: 'waiter_call',
          tableNumber,
          waiterId: tbl?.assignedWaiterId || null,
          message: `Table ${tableNumber} · Waiter bula rahe hain`,
          createdAt: now,
          completedAt: null
        });
      });

      SoundEngine.play('alert');
      showToast('Waiter ko bula diya hai ✓', 'success');
      renderApp();
    }

    function submitCustomerOrder() {
      if (AppState.isSubmittingOrder) return;
      if (!AppState.tableNumber) {
        showToast('Pehle apna table number select karein', 'chilli');
        return;
      }

      // Re-validate stock & latest prices against live DB before submitting
      const invalidItems = AppState.cart.filter(c => {
        const m = SyncStore.db.menuItems.find(x => x.id === c.itemId);
        return !m || !m.inStock;
      });

      if (invalidItems.length > 0) {
        AppState.cart = AppState.cart.filter(c => {
          const m = SyncStore.db.menuItems.find(x => x.id === c.itemId);
          return m && m.inStock;
        });
        saveCart();
        showToast('Kuch items out of stock ho gaye the, cart update kar diya hai.', 'chilli');
        renderApp();
        return;
      }

      const summary = getCartSummary();
      if (summary.validLines.length === 0) {
        showToast('Aapka cart khali hai!', 'chilli');
        return;
      }

      AppState.isSubmittingOrder = true;
      renderApp();

      try {
        const now = Date.now();
        const table = getTableRecord(AppState.tableNumber);
        let createdOrderNumber = 104;

        SyncStore.mutate(db => {
          db.orderCounter = (db.orderCounter || 103) + 1;
          createdOrderNumber = db.orderCounter;

          const newOrder = {
            id: `ORD-${createdOrderNumber}`,
            orderNumber: createdOrderNumber,
            tableNumber: AppState.tableNumber,
            customerName: AppState.customerName.trim(),
            spiceLevel: AppState.spiceLevel,
            generalInstructions: AppState.generalInstructions.trim(),
            status: 'Mila',
            createdAt: now,
            updatedAt: now,
            assignedWaiterId: table.assignedWaiterId || null,
            items: summary.validLines.map(l => ({
              itemId: l.item.id,
              name: l.item.name,
              price: l.item.price,
              qty: l.qty,
              note: (l.note || '').trim()
            })),
            subtotal: summary.subtotal,
            serviceCharge: summary.serviceCharge,
            total: summary.grandTotal
          };

          db.orders.unshift(newOrder);

          // Notify assigned waiter of new order
          db.alerts.unshift({
            id: `alt_ord_${now}_${Math.random().toString(36).slice(2, 6)}`,
            type: 'new_order',
            tableNumber: AppState.tableNumber,
            waiterId: table.assignedWaiterId || null,
            message: `Table ${AppState.tableNumber} · Naya order aaya (#${createdOrderNumber})`,
            createdAt: now,
            completedAt: null
          });
        });

        // Clear submitted cart only, keep table & previous orders intact
        AppState.cart = [];
        AppState.generalInstructions = '';
        saveCart();
        AppState.customerSubView = 'tracking';
        SoundEngine.play('order');
        showToast(`Order #${createdOrderNumber} kitchen ko bhej diya gaya hai! 🎉`, 'success');
      } catch (err) {
        showToast('Order bhejne mein samasya aayi, kripya dubara try karein.', 'chilli');
      } finally {
        AppState.isSubmittingOrder = false;
        renderApp();
      }
    }

    // Kitchen Status Transition
    function advanceKitchenOrder(orderId, nextStatus) {
      const now = Date.now();
      let targetOrder = null;

      SyncStore.mutate(db => {
        const ord = db.orders.find(o => o.id === orderId);
        if (!ord || ord.status === nextStatus) return;
        ord.status = nextStatus;
        ord.updatedAt = now;
        targetOrder = ord;

        if (nextStatus === 'Tayyar') {
          const tbl = db.tables.find(t => t.number === ord.tableNumber);
          db.alerts.unshift({
            id: `alt_rdy_${now}_${Math.random().toString(36).slice(2, 6)}`,
            type: 'food_ready',
            tableNumber: ord.tableNumber,
            waiterId: ord.assignedWaiterId || tbl?.assignedWaiterId || null,
            message: `Table ${ord.tableNumber} ka khana le jao (#${ord.orderNumber})`,
            createdAt: now,
            completedAt: null
          });
        }
      });

      if (targetOrder) {
        if (nextStatus === 'Ban raha hai') {
          showToast(`Order #${targetOrder.orderNumber} banana shuru ho gaya`, 'indigo');
        } else if (nextStatus === 'Tayyar') {
          SoundEngine.play('ready');
          showToast(`Order #${targetOrder.orderNumber} Tayyar! Waiter ko alert bhej diya hai.`, 'success');
        }
      }
      renderApp();
    }

    // Waiter Marks Order Served
    function markOrderServed(orderId) {
      SyncStore.mutate(db => {
        const ord = db.orders.find(o => o.id === orderId);
        if (!ord) return;
        ord.status = 'Serve hua';
        ord.updatedAt = Date.now();
      });
      showToast('Order ko Serve hua mark kar diya gaya ✓', 'success');
      renderApp();
    }

    // Waiter Completes Alert
    function completeWaiterAlert(alertId) {
      const now = Date.now();
      SyncStore.mutate(db => {
        const al = db.alerts.find(a => a.id === alertId);
        if (!al || al.completedAt) return;
        al.completedAt = now;

        // Clear corresponding customer-facing active request flags on the table
        const tbl = db.tables.find(t => t.number === al.tableNumber);
        if (tbl) {
          if (al.type === 'waiter_call') tbl.waiterCalledAt = null;
          if (al.type === 'bill_request') tbl.billRequestedAt = null;
        }
      });
      SoundEngine.play('tap');
      showToast('Alert Done mark kar diya gaya ✓', 'success');
      renderApp();
    }

    function formatTimeAgo(ts) {
      if (!ts) return '';
      const diffSec = Math.max(1, Math.floor((Date.now() - ts) / 1000));
      if (diffSec < 60) return `${diffSec}s ago`;
      const mins = Math.floor(diffSec / 60);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      return `${hrs}h ${mins % 60}m ago`;
    }

    function formatClockTime(ts) {
      return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

                    onclick="updateCartQty('${item.id}', 1)"

    function renderMenuGridOnly() {
      const grid = document.getElementById('zaika-menu-grid');
      if (!grid) return renderApp();
      const filteredItems = SyncStore.db.menuItems
        .filter(item => {
          if (AppState.selectedCategory !== 'all' && item.categoryId !== AppState.selectedCategory) return false;
          if (AppState.vegOnly && !item.isVeg) return false;
          if (AppState.chefPicksOnly && !item.isChefPick) return false;
          if (AppState.popularOnly && !item.isPopular) return false;
          if (AppState.searchQuery.trim() !== '') {
            const q = AppState.searchQuery.toLowerCase();
            if (!item.name.toLowerCase().includes(q) && !item.description.toLowerCase().includes(q)) return false;
          }
          return true;
        })
        .sort((a, b) => a.order - b.order);
      grid.innerHTML = renderMenuCardsList(filteredItems);
    }

    function scrollToMenuSection() {
      const el = document.getElementById('zaika-menu-section');
      if (el) el.scrollIntoView({ behavior: 'smooth' });
    }

    function activateChefPicksFilter() {
      AppState.chefPicksOnly = !AppState.chefPicksOnly;

            </div>
          </div>
        `;
      }

      const questions = SyncStore.db.quizQuestions.slice(0, 3);
      const currentQ = questions[AppState.quizIndex];
      const prizes = SyncStore.db.wheelPrizes;
      const existingClaim = SyncStore.db.claimedRewards.find(r => r.tableNumber === AppState.tableNumber);

      // Build SVG wheel slices
      const sliceAngle = 360 / prizes.length;
      const wheelSlicesSvg = prizes.map((p, idx) => {
        const startDeg = idx * sliceAngle;
        const endDeg = startDeg + sliceAngle;
        const startRad = (Math.PI / 180) * (startDeg - 90);
        const endRad = (Math.PI / 180) * (endDeg - 90);
        const x1 = 150 + 140 * Math.cos(startRad);
        const y1 = 150 + 140 * Math.sin(startRad);
        const x2 = 150 + 140 * Math.cos(endRad);
        const y2 = 150 + 140 * Math.sin(endRad);
        const largeArc = sliceAngle > 180 ? 1 : 0;
        const midDeg = startDeg + sliceAngle / 2 - 90;
        const midRad = (Math.PI / 180) * midDeg;
        const tx = 150 + 86 * Math.cos(midRad);
        const ty = 150 + 86 * Math.sin(midRad);

        return `
          <path d="M150,150 L${x1.toFixed(1)},${y1.toFixed(1)} A140,140 0 ${largeArc},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${p.color}" stroke="#ffffff" stroke-width="2" />
          <text x="${tx.toFixed(1)}" y="${ty.toFixed(1)}" fill="${p.textColor}" font-size="9.5" font-weight="bold" text-anchor="middle" dominant-baseline="middle" transform="rotate(${midDeg + 90}, ${tx.toFixed(1)}, ${ty.toFixed(1)})">
            ${escapeHtml(p.label.slice(0, 18))}
          </text>
        `;
      }).join('');

      return `
        <div class="flex-1 w-full max-w-2xl mx-auto px-3 sm:px-5 pt-4 pb-12 space-y-5 animate-enter">
          <div class="flex items-center justify-between">
            <button type="button" onclick="AppState.customerSubView = 'menu'; renderApp();" class="px-3.5 py-2 rounded-xl bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder text-xs font-bold">
              ← Menu
            </button>
            <span class="font-heading font-extrabold text-base text-indigoBrand dark:text-marigold">Zaika Fun Zone 🎡</span>
          </div>

          <!-- FOOD QUIZ CARD -->
          <section class="bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder rounded-3xl p-5 shadow-soft space-y-4">
            <div class="flex items-center justify-between">
              <h2 class="font-heading font-extrabold text-lg text-indigoBrand dark:text-marigold">🧠 Food Quiz</h2>
              <span class="text-xs font-bold px-2.5 py-1 rounded-full bg-marigold/20 text-indigoBrand dark:text-marigold">
                Score: ${AppState.quizScore}/${questions.length}
              </span>
            </div>

            ${AppState.quizFinished || !currentQ ? `
              <div class="p-5 rounded-2xl bg-creamBg dark:bg-midnightBg text-center space-y-3">
                <div class="text-3xl">🏆</div>
                <h3 class="font-heading font-bold text-lg">Quiz Complete! Score: ${AppState.quizScore} / ${questions.length}</h3>
                <p class="text-xs text-mutedLight dark:text-mutedDark">Kya baat hai! Aap sachche foodie hain.</p>
                <button type="button" onclick="restartFoodQuiz()" class="px-4 py-2 rounded-xl bg-indigoBrand text-white text-xs font-bold">
                  Dobara Khelein ↻
                </button>
              </div>
            ` : `
              <div class="space-y-3">
                <div class="text-xs font-semibold text-mutedLight dark:text-mutedDark">
                  Sawaal ${AppState.quizIndex + 1} of ${questions.length}
                </div>
                <p class="font-heading font-bold text-base leading-snug">${escapeHtml(currentQ.question)}</p>

                <div class="space-y-2">
                  ${currentQ.options.map((opt, idx) => {
                    const answered = AppState.quizSelectedOption !== null;
                    const isSelected = AppState.quizSelectedOption === idx;
                    const isCorrect = idx === currentQ.correctIndex;
                    let cls = 'bg-creamBg dark:bg-midnightBg border-creamBorder dark:border-midnightBorder hover:border-indigoBrand';
                    if (answered) {
                      if (isCorrect) cls = 'bg-success/15 border-success text-success font-bold';
                      else if (isSelected) cls = 'bg-chilli/15 border-chilli text-chilli';
                    }
                    return `
                      <button
                        type="button"
                        ${answered ? 'disabled' : ''}
                        onclick="answerQuizQuestion(${idx})"
                        class="w-full text-left px-4 py-3 rounded-2xl border text-xs sm:text-sm transition ${cls}">
                        ${escapeHtml(opt)}
                      </button>
                    `;
                  }).join('')}
                </div>

                ${AppState.quizSelectedOption !== null ? `
                  <div class="p-3 rounded-2xl bg-indigoBrand/10 dark:bg-indigoBrand/40 text-xs leading-relaxed">
                    <strong>Did you know?</strong> ${escapeHtml(currentQ.fact || '')}
                  </div>
                  <button type="button" onclick="nextQuizQuestion()" class="w-full py-2.5 rounded-xl bg-indigoBrand text-white text-xs font-bold">
                    ${AppState.quizIndex + 1 < questions.length ? 'Agla Sawaal →' : 'Result Dekhein →'}
                  </button>
                ` : ''}
              </div>
            `}
          </section>

          <!-- SPIN WHEEL CARD -->
          <section class="bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder rounded-3xl p-5 shadow-soft text-center space-y-4">
            <div>
              <h2 class="font-heading font-extrabold text-lg text-indigoBrand dark:text-marigold">🎡 Zaika Spin & Win</h2>
              <p class="text-xs text-mutedLight dark:text-mutedDark">Har table session par 1 free spin! Reward ID waiter ko dikhayein.</p>
            </div>

            <div class="relative w-64 h-64 mx-auto">
              <!-- Top Pointer -->
              <div class="absolute -top-2 left-1/2 -translate-x-1/2 z-20 w-0 h-0 border-l-[10px] border-l-transparent border-r-[10px] border-r-transparent border-t-[18px] border-t-chilli drop-shadow"></div>
              <svg
                viewBox="0 0 300 300"
                style="transform: rotate(${AppState.wheelRotation}deg); transition: transform 3.2s cubic-bezier(0.17, 0.67, 0.12, 0.99);"
                class="w-full h-full rounded-full shadow-lg">
                ${wheelSlicesSvg}
                <circle cx="150" cy="150" r="22" fill="#2B2F6B" stroke="#F4B63F" stroke-width="4" />
              </svg>
            </div>

            ${existingClaim ? `
              <div class="p-4 rounded-2xl bg-success/10 border border-success/30 space-y-1">
                <p class="text-xs font-bold text-success">Table ${AppState.tableNumber} Reward Claimed!</p>
                <p class="font-heading font-extrabold text-base">${escapeHtml(existingClaim.prizeLabel)}</p>
                <p class="text-[11px] font-mono bg-creamCard dark:bg-midnightCard inline-block px-2.5 py-1 rounded-lg border border-creamBorder dark:border-midnightBorder">
                  Code: ${escapeHtml(existingClaim.rewardCode)}
                </p>
              </div>
            ` : `
              <button
                type="button"
                ${AppState.wheelSpinning ? 'disabled' : ''}
                onclick="spinZaikaWheel()"
                class="px-6 py-3 rounded-2xl bg-marigold hover:bg-marigoldDark text-inkLight font-heading font-extrabold text-sm sm:text-base shadow-glow transition">
                ${AppState.wheelSpinning ? 'Ghoom raha hai...' : 'Wheel Ghumayein! 🎲'}
              </button>
            `}
          </section>
        </div>
      `;
    }

    function answerQuizQuestion(idx) {
      const q = SyncStore.db.quizQuestions[AppState.quizIndex];
      if (!q || AppState.quizSelectedOption !== null) return;
      AppState.quizSelectedOption = idx;
      if (idx === q.correctIndex) {
        AppState.quizScore += 1;
        SoundEngine.play('tap');
      }
      renderApp();
    }

    function nextQuizQuestion() {
      const total = Math.min(3, SyncStore.db.quizQuestions.length);
      if (AppState.quizIndex + 1 < total) {
        AppState.quizIndex += 1;
        AppState.quizSelectedOption = null;
      } else {
        AppState.quizFinished = true;
      }
      renderApp();
    }

    function restartFoodQuiz() {
      AppState.quizIndex = 0;
      AppState.quizScore = 0;
      AppState.quizSelectedOption = null;
      AppState.quizFinished = false;
      renderApp();
    }

    function spinZaikaWheel() {
      if (AppState.wheelSpinning) return;
      const existing = SyncStore.db.claimedRewards.find(r => r.tableNumber === AppState.tableNumber);
      if (existing) return;

      const prizes = SyncStore.db.wheelPrizes;
      const winIndex = Math.floor(Math.random() * prizes.length);
      const sliceAngle = 360 / prizes.length;
      const targetCenter = winIndex * sliceAngle + sliceAngle / 2;
      const extraSpins = 360 * 5;
      AppState.wheelSpinning = true;
      AppState.wheelRotation = extraSpins + (360 - targetCenter);
      renderApp();

      setTimeout(() => {
        AppState.wheelSpinning = false;
        const won = prizes[winIndex];
        const code = `ZAIKA-${Math.random().toString(36).substring(2, 7).toUpperCase()}`;
        SyncStore.mutate(db => {
          db.claimedRewards.push({
            id: `rew_${Date.now()}`,
            tableNumber: AppState.tableNumber,
            prizeLabel: won.label,
            rewardCode: code,
            claimedAt: Date.now()
          });
        });
        SoundEngine.play('ready');
        renderApp();
      }, 3300);
    }

                  name="staffId"
                  required
                  class="w-full px-3.5 py-3 rounded-2xl text-sm bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder focus:outline-none focus:border-indigoBrand">

                  `).join('')}

                  maxlength="6"

                  placeholder="••••"

    function handleStaffLoginSubmit(event, allowedRoles) {
      event.preventDefault();
      const form = event.target;
      const staffId = form.staffId.value;
      const pin = form.pin.value.trim();
      const staff = SyncStore.db.staff.find(s => s.id === staffId && s.active);

      if (!staff) {
        showToast('Staff account inactive ya invalid hai', 'chilli');
        return;
      }
      if (!allowedRoles.includes(staff.role)) {
        showToast(`Access denied: ${staff.role} ko is screen ki permission nahi hai.`, 'chilli');
        return;
      }
      if (hashPinSync(pin) !== staff.pinHash) {
        showToast('Galat PIN! Kripya sahi PIN daalein.', 'chilli');
        return;
      }

      AppState.staffSession = {
        staffId: staff.id,
        role: staff.role,
        expiresAt: Date.now() + 8 * 60 * 60 * 1000 // 8 hour shift session
      };
      sessionStorage.setItem('zaika_staff_session', JSON.stringify(AppState.staffSession));
      SoundEngine.play('tap');
      showToast(`Welcome, ${staff.name}! ✓`, 'success');
      renderApp();
    }

    function logoutStaff() {
      AppState.staffSession = null;
      sessionStorage.removeItem('zaika_staff_session');
      showToast('Logged out successfully', 'indigo');
      renderApp();
    }

    // --------------------------------------------------------------------------
    // 17. KITCHEN DASHBOARD VIEW
    // --------------------------------------------------------------------------
    function renderKitchenView() {
      const staff = getLoggedStaff();
      if (!staff || !['Kitchen', 'Admin'].includes(staff.role)) {
        return renderStaffLoginGate('Zaika Kitchen', ['Kitchen', 'Admin']);
      }

      const allOrders = SyncStore.db.orders;
      const newCount = allOrders.filter(o => o.status === 'Mila').length;
      const prepCount = allOrders.filter(o => o.status === 'Ban raha hai').length;
      const readyCount = allOrders.filter(o => o.status === 'Tayyar').length;
      const activeCount = newCount + prepCount + readyCount;

      const visibleOrders = allOrders
        .filter(o => {
          if (o.status === 'Serve hua') return false;
          if (AppState.kitchenFilter !== 'all' && o.status !== AppState.kitchenFilter) return false;
          return true;
        })
        .sort((a, b) => {
          // Prioritize New ('Mila') first, then Preparing, then Ready
          const rank = { 'Mila': 1, 'Ban raha hai': 2, 'Tayyar': 3 };
          if (rank[a.status] !== rank[b.status]) return rank[a.status] - rank[b.status];
          return a.createdAt - b.createdAt;

            </div>

        </div>

            <label class="block font-bold mb-1">Image URL (or upload file below)</label>
            <input type="url" id="admin-item-img-url" name="image" value="${escapeHtml(existing?.image || 'https://images.unsplash.com/photo-1585937421612-70a008356fbe?auto=format&fit=crop&w=600&q=80')}" class="w-full px-3.5 py-2 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />

              <input type="checkbox" name="isPopular" ${existing?.isPopular ? 'checked' : ''} /> Popular

              <input type="checkbox" name="isChefPick" ${existing?.isChefPick ? 'checked' : ''} /> Chef ki pasand (Max 3)

          </div>

          <div class="flex justify-end gap-2 pt-3">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-creamElevated dark:bg-midnightElevated font-bold">Cancel</button>
            <button type="submit" class="px-5 py-2 rounded-xl bg-indigoBrand text-white font-bold">Save Dish ✓</button>
          </div>
        </form>
      `);
    }

    function saveAdminMenuItem(event, existingId) {
      event.preventDefault();
      const f = event.target;
      const wantChefPick = f.isChefPick.checked;

      // Enforce exact max 3 Chef ki pasand
      if (wantChefPick) {
        const otherChefPicks = SyncStore.db.menuItems.filter(m => m.isChefPick && m.id !== existingId);
        if (otherChefPicks.length >= 3) {
          showToast('Chef ki pasand mein maximum 3 dishes ho sakti hain. Pehle kisi ek ko uncheck karein.', 'chilli');
          return;
        }
      }

      SyncStore.mutate(db => {
        const payload = {
          name: f.name.value.trim(),
          price: Number(f.price.value),
          categoryId: f.categoryId.value,
          description: f.description.value.trim(),
          image: f.image.value.trim() || FOOD_FALLBACK_SVG,
          isVeg: f.isVeg.checked,
          inStock: f.inStock.checked,
          isPopular: f.isPopular.checked,
          isChefPick: wantChefPick
        };

        if (existingId) {
          const item = db.menuItems.find(m => m.id === existingId);
          if (item) Object.assign(item, payload);
        } else {
          db.menuItems.push({
            id: `item_${Date.now()}`,
            order: db.menuItems.length + 1,
            ...payload
          });
        }
      });

      closeModal();
      showToast('Menu dish save ho gayi hai ✓', 'success');
      renderApp();
    }

    function toggleAdminItemStock(itemId) {
      SyncStore.mutate(db => {
        const item = db.menuItems.find(m => m.id === itemId);
        if (item) item.inStock = !item.inStock;
      });
      renderApp();
    }

    function setAdminTodaySpecial(itemId) {
      SyncStore.mutate(db => {
        db.settings.todaySpecialId = itemId;
      });
      showToast('Aaj ka Special update kar diya gaya ✓', 'marigold');
      renderApp();
    }

    function deleteAdminMenuItem(itemId) {
      confirmAction('Delete Menu Item?', 'Kya aap is dish ko menu se hatana chahte hain?', 'Haan, Delete Karein', () => {
        SyncStore.mutate(db => {
          db.menuItems = db.menuItems.filter(m => m.id !== itemId);
        });
        showToast('Dish delete ho gayi', 'indigo');
        renderApp();
      });
    }

    // Admin Tab 2: Category Management
    function renderAdminCategoriesTab() {
      const cats = [...SyncStore.db.categories].sort((a, b) => a.order - b.order);

      return `
        <div class="bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder rounded-3xl p-5 space-y-4">
          <div class="flex flex-wrap items-center justify-between gap-2">
            <h2 class="font-heading font-extrabold text-lg">Menu Categories</h2>
            <form onsubmit="addAdminCategory(event)" class="flex items-center gap-2">
              <input type="text" name="catName" required placeholder="Nayi category ka naam..." class="px-3.5 py-2 rounded-xl text-xs sm:text-sm bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />

          </div>

          <div class="divide-y divide-creamBorder dark:divide-midnightBorder">
            ${cats.map((cat, idx) => `
              <div class="py-3 flex flex-wrap items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="text-xs font-mono text-mutedLight">#${idx + 1}</span>
                  <input
                    type="text"

                </div>

                <div class="flex items-center gap-1.5">
                  <button type="button" onclick="moveAdminCategory('${cat.id}', -1)" ${idx === 0 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg bg-creamElevated dark:bg-midnightElevated text-xs font-bold disabled:opacity-40">↑</button>
                  <button type="button" onclick="moveAdminCategory('${cat.id}', 1)" ${idx === cats.length - 1 ? 'disabled' : ''} class="px-2.5 py-1.5 rounded-lg bg-creamElevated dark:bg-midnightElevated text-xs font-bold disabled:opacity-40">↓</button>
                  <button type="button" onclick="toggleAdminCategoryVis('${cat.id}')" class="px-3 py-1.5 rounded-lg text-xs font-bold ${cat.visible ? 'bg-success/15 text-success' : 'bg-creamElevated text-mutedLight'}">
                    ${cat.visible ? 'Visible' : 'Hidden'}
                  </button>
                  <button type="button" onclick="deleteAdminCategory('${cat.id}')" class="px-2.5 py-1.5 rounded-lg text-xs font-bold text-chilli hover:bg-chilli/10">Delete</button>

            `).join('')}
          </div>
        </div>
      `;

    function addAdminCategory(e) {
      e.preventDefault();
      const name = e.target.catName.value.trim();
      if (!name) return;
      SyncStore.mutate(db => {
        db.categories.push({
          id: `cat_${Date.now()}`,
          name,
          order: db.categories.length + 1,
          visible: true
        });
      });
      e.target.reset();
      showToast('Category add ho gayi ✓', 'success');
      renderApp();
    }

    function renameAdminCategory(catId, newName) {
      if (!newName.trim()) return;
      SyncStore.mutate(db => {
        const c = db.categories.find(x => x.id === catId);
        if (c) c.name = newName.trim();
      });
      showToast('Category rename ho gayi', 'indigo');
    }

    function moveAdminCategory(catId, dir) {
      SyncStore.mutate(db => {
        const sorted = [...db.categories].sort((a, b) => a.order - b.order);
        const idx = sorted.findIndex(c => c.id === catId);
        const swapIdx = idx + dir;
        if (swapIdx < 0 || swapIdx >= sorted.length) return;
        const temp = sorted[idx].order;
        sorted[idx].order = sorted[swapIdx].order;
        sorted[swapIdx].order = temp;
      });
      renderApp();
    }

    function toggleAdminCategoryVis(catId) {
      SyncStore.mutate(db => {
        const c = db.categories.find(x => x.id === catId);
        if (c) c.visible = !c.visible;
      });
      renderApp();
    }

    function deleteAdminCategory(catId) {
      confirmAction('Delete Category?', 'Is category ko delete karne par dishes uncategorized ho jayengi.', 'Delete', () => {
        SyncStore.mutate(db => {
          db.categories = db.categories.filter(c => c.id !== catId);
        });
        renderApp();
      });
    }

    // Admin Tab 3: Tables, Waiter Assignment & QR Code Generator
    function renderAdminTablesAndQrTab() {
      const tables = [...SyncStore.db.tables].sort((a, b) => a.number - b.number);
      const waiters = SyncStore.db.staff.filter(s => s.role === 'Waiter' && s.active);

      setTimeout(() => renderQrCanvas(qrLink), 10);

      return `
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-4">
          <!-- Left 2 cols: Table & Waiter Mapping -->
          <div class="lg:col-span-2 bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder rounded-3xl p-5 space-y-4">

              <h2 class="font-heading font-extrabold text-lg">Tables & Waiter Assignment</h2>

            </div>

            <!-- Bulk Range Assignment Helper -->
            <form onsubmit="bulkAssignWaiterRange(event)" class="p-3.5 rounded-2xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder flex flex-wrap items-center gap-2 text-xs">
              <span class="font-bold">Quick Range Assign:</span>
              <select name="waiterId" class="px-2.5 py-1.5 rounded-xl bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder">
                ${waiters.map(w => `<option value="${w.id}">${escapeHtml(w.name)}</option>`).join('')}
              </select>
              <span>Tables</span>
              <input type="number" name="fromTable" min="1" value="1" class="w-16 px-2 py-1.5 rounded-xl bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder" />
              <span>to</span>
              <input type="number" name="toTable" min="1" value="8" class="w-16 px-2 py-1.5 rounded-xl bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder" />
              <button type="submit" class="px-3 py-1.5 rounded-xl bg-indigoBrand text-white font-bold">Apply</button>
            </form>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              ${tables.map(t => `
                <div class="p-3 rounded-2xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder flex items-center justify-between gap-2">
                  <div>
                    <div class="font-heading font-bold text-sm">Table ${t.number}</div>
                    <select
                      onchange="assignWaiterToTable(${t.number}, this.value)"
                      class="mt-1 px-2.5 py-1 rounded-lg text-xs bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder">
                      <option value="">Unassigned</option>
                      ${waiters.map(w => `<option value="${w.id}" ${t.assignedWaiterId === w.id ? 'selected' : ''}>${escapeHtml(w.name)}</option>`).join('')}
                    </select>
                  </div>

                  <div class="flex items-center gap-1.5">
                    <button
                      type="button"
                      onclick="AppState.selectedQrTable = ${t.number}; renderApp();"
                      class="px-2.5 py-1.5 rounded-xl text-xs font-bold ${qrTableNum === t.number ? 'bg-marigold text-inkLight' : 'bg-indigoBrand text-white'}">
                      QR
                    </button>
                    <button
                      type="button"
                      onclick="removeAdminTable(${t.number})"
                      class="px-2 py-1.5 rounded-xl text-xs font-bold text-chilli hover:bg-chilli/10">
                      ✕
                    </button>
                  </div>
                </div>
              `).join('')}
            </div>
          </div>

          <!-- Right col: Live QR Code Generator, Download & Print -->
          <div class="bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder rounded-3xl p-5 flex flex-col items-center text-center space-y-4">
            <span class="px-3 py-1 rounded-full bg-indigoBrand text-marigold font-heading font-bold text-xs">
              Table QR Generator
            </span>
            <h3 class="font-heading font-extrabold text-xl">Table ${qrTableNum} QR</h3>

            <div id="zaika-qr-box" class="p-4 bg-white rounded-2xl border-2 border-indigoBrand shadow-xs flex items-center justify-center min-h-[192px] min-w-[192px]"></div>

            <div class="w-full text-[11px] font-mono break-all p-2.5 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder">
              ${escapeHtml(qrLink)}
            </div>

            <div class="grid grid-cols-2 gap-2 w-full">
              <button type="button" onclick="downloadTableQrPng(${qrTableNum})" class="py-2.5 px-3 rounded-xl bg-indigoBrand text-white text-xs font-bold">
                ⬇ Download PNG
              </button>
              <button type="button" onclick="printTableQrCard(${qrTableNum}, '${escapeHtml(qrLink)}')" class="py-2.5 px-3 rounded-xl bg-marigold text-inkLight text-xs font-bold">
                🖨️ Print QR
              </button>
            </div>

            <button
              type="button"
              onclick="setTableNumber(${qrTableNum}); switchAppView('customer');"
              class="w-full py-2.5 rounded-xl border border-indigoBrand/30 dark:border-marigold/40 text-xs font-bold text-indigoBrand dark:text-marigold">
              Open Table ${qrTableNum} Customer View →
            </button>
          </div>
        </div>
      `;
    }

    function renderQrCanvas(url) {
      const box = document.getElementById('zaika-qr-box');
      if (!box || typeof QRCode === 'undefined') return;
      box.innerHTML = '';
      new QRCode(box, {
        text: url,
        width: 176,
        height: 176,
        colorDark: '#2B2F6B',
        colorLight: '#ffffff',
        correctLevel: QRCode.CorrectLevel.H
      });
    }

    function downloadTableQrPng(tableNum) {
      const canvas = document.querySelector('#zaika-qr-box canvas');
      if (!canvas) {
        showToast('QR image ready nahi hai', 'chilli');
        return;
      }
      const link = document.createElement('a');
      link.download = `ZAIKA-Table-${tableNum}-QR.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      showToast(`Table ${tableNum} QR download ho gaya ✓`, 'success');
    }

    function printTableQrCard(tableNum, url) {
      const printArea = document.getElementById('qr-print-area');
      const canvas = document.querySelector('#zaika-qr-box canvas');
      const dataUrl = canvas ? canvas.toDataURL('image/png') : '';
      printArea.innerHTML = `
        <div style="border: 4px solid #2B2F6B; border-radius: 24px; padding: 32px; text-align: center; max-width: 340px; font-family: sans-serif;">
          <h1 style="color: #2B2F6B; margin: 0 0 8px 0; font-size: 28px;">${escapeHtml(SyncStore.db.settings.restaurantName)}</h1>
          <div style="background: #F4B63F; color: #1E2038; font-weight: bold; padding: 6px 18px; border-radius: 99px; display: inline-block; margin-bottom: 16px;">
            TABLE ${tableNum}
          </div>
          <div><img src="${dataUrl}" style="width: 220px; height: 220px; margin: 0 auto;" /></div>
          <p style="margin: 16px 0 4px 0; font-weight: bold; font-size: 16px;">Scan to Order Food</p>
          <p style="margin: 0; font-size: 11px; color: #555;">${escapeHtml(url)}</p>
        </div>
      `;
      window.print();
    }

    function addAdminTable() {
      const maxNum = SyncStore.db.tables.reduce((m, t) => Math.max(m, t.number), 0);
      const nextNum = maxNum + 1;
      SyncStore.mutate(db => {
        db.tables.push({
          number: nextNum,
          label: `Table ${nextNum}`,
          assignedWaiterId: db.staff.find(s => s.role === 'Waiter' && s.active)?.id || null,
          dnd: false,
          waiterCalledAt: null,
          billRequestedAt: null
        });
      });
      showToast(`Table ${nextNum} add ho gaya ✓`, 'success');
      renderApp();
    }

    function removeAdminTable(num) {
      confirmAction(`Remove Table ${num}?`, 'Is table ko system se hataya jayega.', 'Remove', () => {
        SyncStore.mutate(db => {
          db.tables = db.tables.filter(t => t.number !== num);
        });
        renderApp();
      });
    }

    function assignWaiterToTable(tableNum, waiterId) {
      SyncStore.mutate(db => {
        const tbl = db.tables.find(t => t.number === tableNum);
        if (tbl) tbl.assignedWaiterId = waiterId || null;
      });
      showToast(`Table ${tableNum} waiter assign ho gaya ✓`, 'success');
    }

    function bulkAssignWaiterRange(e) {
      e.preventDefault();
      const waiterId = e.target.waiterId.value;
      const fromT = parseInt(e.target.fromTable.value, 10);
      const toT = parseInt(e.target.toTable.value, 10);
      SyncStore.mutate(db => {
        db.tables.forEach(t => {
          if (t.number >= fromT && t.number <= toT) {
            t.assignedWaiterId = waiterId;
          }
        });
      });
      showToast(`Tables ${fromT}–${toT} assign ho gaye ✓`, 'success');
      renderApp();
    }

                </div>

                <div class="flex items-center gap-2">
                  <button type="button" onclick="promptResetStaffPin('${st.id}', '${escapeHtml(st.name)}')" class="px-3 py-1.5 rounded-xl bg-creamElevated dark:bg-midnightElevated text-xs font-bold">
                    Reset PIN
                  </button>
                  <button type="button" onclick="toggleStaffActive('${st.id}')" class="px-3 py-1.5 rounded-xl text-xs font-bold ${st.active ? 'bg-chilli/15 text-chilli' : 'bg-success/15 text-success'}">
                    ${st.active ? 'Disable' : 'Enable'}
                  </button>
                </div>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    function openAddStaffModal() {
      openModal('Naya Staff Account Banayein', `
        <form onsubmit="createAdminStaff(event)" class="space-y-3 text-sm">
          <div>
            <label class="block text-xs font-bold mb-1">Staff Name</label>
            <input type="text" name="name" required placeholder="e.g. Suresh" class="w-full px-3.5 py-2.5 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">Role</label>
            <select name="role" class="w-full px-3.5 py-2.5 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder">
              <option value="Waiter">Waiter</option>
              <option value="Kitchen">Kitchen</option>
              <option value="Admin">Admin</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold mb-1">4-Digit PIN</label>
            <input type="password" name="pin" inputmode="numeric" minlength="4" maxlength="6" required placeholder="e.g. 5555" class="w-full px-3.5 py-2.5 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />
          </div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-creamElevated dark:bg-midnightElevated text-xs font-bold">Cancel</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigoBrand text-white text-xs font-bold">Create Account</button>
          </div>
        </form>
      `, 'max-w-sm');
    }

    function createAdminStaff(e) {
      e.preventDefault();
      const f = e.target;
      SyncStore.mutate(db => {
        db.staff.push({
          id: `staff_${Date.now()}`,
          name: f.name.value.trim(),
          role: f.role.value,
          pinHash: hashPinSync(f.pin.value.trim()),
          active: true
        });
      });
      closeModal();
      showToast('Staff account add ho gaya ✓', 'success');
      renderApp();
    }

    function promptResetStaffPin(staffId, staffName) {
      openModal(`Reset PIN — ${staffName}`, `
        <form onsubmit="event.preventDefault(); SyncStore.mutate(db => { const s = db.staff.find(x => x.id === '${staffId}'); if (s) s.pinHash = hashPinSync(this.newPin.value.trim()); }); closeModal(); showToast('PIN update ho gaya ✓', 'success');" class="space-y-3">
          <input type="password" name="newPin" inputmode="numeric" minlength="4" maxlength="6" required placeholder="Naya 4-digit PIN" class="w-full px-4 py-2.5 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />
          <div class="flex justify-end gap-2">
            <button type="button" onclick="closeModal()" class="px-4 py-2 rounded-xl bg-creamElevated dark:bg-midnightElevated text-xs font-bold">Cancel</button>
            <button type="submit" class="px-4 py-2 rounded-xl bg-indigoBrand text-white text-xs font-bold">Save PIN</button>
          </div>
        </form>
      `, 'max-w-sm');
    }

    function toggleStaffActive(staffId) {
      const current = getLoggedStaff();
      if (current && current.id === staffId) {
        showToast('Aap apna khud ka Admin account disable nahi kar sakte.', 'chilli');
        return;
      }
      SyncStore.mutate(db => {
        const s = db.staff.find(x => x.id === staffId);
        if (s) s.active = !s.active;
      });
      renderApp();
    }

    // Admin Tab 5: Restaurant Settings, Quiz, Wheel & Firebase Connector
    function renderAdminSettingsTab() {
      const s = SyncStore.db.settings;
      return `
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-4">
          <form onsubmit="saveAdminSettings(event)" class="bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder rounded-3xl p-5 space-y-3 text-xs sm:text-sm">
            <h2 class="font-heading font-extrabold text-lg">Restaurant & Real-Time Settings</h2>

            <div>
              <label class="block font-bold mb-1">Restaurant Brand Name</label>
              <input type="text" name="restaurantName" value="${escapeHtml(s.restaurantName)}" required class="w-full px-3.5 py-2 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />
            </div>

            <div>
              <label class="block font-bold mb-1">Welcome Subtitle</label>
              <input type="text" name="welcomeSubtitle" value="${escapeHtml(s.welcomeSubtitle)}" class="w-full px-3.5 py-2 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block font-bold mb-1">Est. Prep Time (mins)</label>
                <input type="number" name="estPrepMinutes" min="5" max="90" value="${s.estPrepMinutes}" class="w-full px-3.5 py-2 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />
              </div>
              <div>
                <label class="block font-bold mb-1">Service Charge (%)</label>
                <input type="number" name="serviceChargePercent" min="0" max="25" step="0.5" value="${s.serviceChargePercent}" class="w-full px-3.5 py-2 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder" />
              </div>
            </div>

            <div>
              <label class="block font-bold mb-1">Optional Firebase Realtime DB URL (Cross-Device Cloud Sync)</label>
              <input type="url" name="firebaseDbUrl" value="${escapeHtml(s.firebaseDbUrl || '')}" placeholder="https://your-project-default-rtdb.firebaseio.com" class="w-full px-3.5 py-2 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder font-mono text-xs" />
              <p class="text-[11px] text-mutedLight dark:text-mutedDark mt-1">
                Khali chhodne par multi-tab local real-time sync chalta rahega. Firebase URL dene par alag-alag phones par live sync activate ho jayega.
              </p>
            </div>

            <button type="submit" class="w-full py-3 rounded-2xl bg-indigoBrand text-white font-heading font-bold text-sm">
              Save Restaurant Settings ✓
            </button>
          </form>

          <!-- Quiz & Spin Wheel Config -->
          <div class="bg-creamCard dark:bg-midnightCard border border-creamBorder dark:border-midnightBorder rounded-3xl p-5 space-y-4 text-xs sm:text-sm">
            <h2 class="font-heading font-extrabold text-lg">Fun Zone Configuration</h2>

            <div class="space-y-2">
              <div class="font-bold">Spin Wheel Prizes (Comma separated)</div>
              <form onsubmit="saveAdminWheelPrizes(event)" class="space-y-2">
                <textarea name="prizesCsv" rows="2" class="w-full px-3.5 py-2 rounded-xl bg-creamBg dark:bg-midnightBg border border-creamBorder dark:border-midnightBorder">${escapeHtml(SyncStore.db.wheelPrizes.map(p => p.label).join(', '))}</textarea>
                <button type="submit" class="px-4 py-2 rounded-xl bg-marigold text-inkLight font-bold text-xs">Update Wheel Prizes</button>
              </form>
            </div>

            <div class="space-y-2 pt-2 border-t border-creamBorder dark:border-midnightBorder">
              <div class="font-bold">Food Quiz Questions (${SyncStore.db.quizQuestions.length})</div>
              ${SyncStore.db.quizQuestions.map((q, idx) => `
                <div class="p-2.5 rounded-xl bg-creamBg dark:bg-midnightBg">
                  <div class="font-semibold">Q${idx + 1}: ${escapeHtml(q.question)}</div>
                  <div class="text-[11px] text-success mt-0.5">Ans: ${escapeHtml(q.options[q.correctIndex])}</div>
                </div>
              `).join('')}
            </div>
          </div>
        </div>
      `;
    }

    function saveAdminSettings(e) {
      e.preventDefault();
      const f = e.target;
      SyncStore.mutate(db => {
        db.settings.restaurantName = f.restaurantName.value.trim() || 'ZAIKA';
        db.settings.welcomeSubtitle = f.welcomeSubtitle.value.trim();
        db.settings.estPrepMinutes = Number(f.estPrepMinutes.value) || 15;
        db.settings.serviceChargePercent = Number(f.serviceChargePercent.value) || 0;
        db.settings.firebaseDbUrl = f.firebaseDbUrl.value.trim();
      });
      SyncStore.setupFirebasePolling();
      showToast('Settings save ho gayi hain ✓', 'success');
      renderApp();
    }

    function saveAdminWheelPrizes(e) {
      e.preventDefault();
      const labels = e.target.prizesCsv.value.split(',').map(s => s.trim()).filter(Boolean);
      if (labels.length < 2) {
        showToast('Kam se kam 2 prizes likhein', 'chilli');
        return;
      }
      const palette = ['#2B2F6B', '#F4B63F', '#E6E0D6', '#1F8A5B', '#D8402F', '#43499E'];
      SyncStore.mutate(db => {
        db.wheelPrizes = labels.map((lbl, idx) => ({
          id: `p_${idx}_${Date.now()}`,
          label: lbl,
          color: palette[idx % palette.length],
          textColor: idx % palette.length === 1 || idx % palette.length === 2 ? '#1E2038' : '#FFFFFF',
          isWin: !lbl.toLowerCase().includes('better luck')
        }));
      });
      showToast('Spin wheel prizes update ho gaye ✓', 'success');
      renderApp();
    }

    // --------------------------------------------------------------------------
    // 20. MAIN APPLICATION RENDER ORCHESTRATOR
    // --------------------------------------------------------------------------
    function renderApp() {
      const root = document.getElementById('app');
      if (!root) return;

      let mainContent = '';
      if (AppState.activeView === 'customer') {
        mainContent = renderCustomerView();
      } else if (AppState.activeView === 'kitchen') {
        mainContent = renderKitchenView();
      } else if (AppState.activeView === 'waiter') {
        mainContent = renderWaiterView();
      } else if (AppState.activeView === 'admin') {
        mainContent = renderAdminView();
      }

      root.innerHTML = `
        ${renderTopUtilityBar()}
        <main class="flex-1 flex flex-col w-full max-w-full">
          ${mainContent}
        </main>
      `;
    }

    // Bootstrap Application
    window.addEventListener('DOMContentLoaded', () => {
      SyncStore.init();
      detectTableFromUrl();
      SyncStore.subscribe(() => renderApp());
      renderApp();

      // Keep relative elapsed timers fresh in Kitchen & Waiter views
      setInterval(() => {
        if (AppState.activeView === 'kitchen' || AppState.activeView === 'waiter') {
          renderApp();
        }
      }, 20000);
    });
  </script>
</body>
</html>
